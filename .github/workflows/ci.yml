name: CI

on: [push, pull_request]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r api/requirements.txt

      - name: Run tests
        run: pytest -q

  # Runs only once Sebastian pushes contracts/. Until then it skips instead of
  # failing, so a red CI always means something is actually broken.
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Look for contracts
        id: look
        run: |
          if [ -d contracts ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No contracts/ directory yet, skipping forge test."
          fi

      - name: Install Foundry
        if: steps.look.outputs.found == 'true'
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run forge test
        if: steps.look.outputs.found == 'true'
        working-directory: contracts
        run: forge test -vv
