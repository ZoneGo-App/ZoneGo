name: CI

on: [push, pull_request]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r api/requirements.txt

      - name: Run tests
        run: pytest -q

  # Runs only once Sebastian pushes contracts/. Until then it skips instead of
  # failing, so a red CI always means something is actually broken.
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Look for contracts
        id: look
        run: |
          if [ -d contracts ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No contracts/ directory yet, skipping forge test."
          fi

      - name: Install Foundry
        if: steps.look.outputs.found == 'true'
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run forge test
        if: steps.look.outputs.found == 'true'
        working-directory: contracts
        run: forge test -vv

  # Same pattern: skip instead of fail until frontend/ exists on the branch
  # being checked, so a red CI always means something real broke.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Look for frontend
        id: look
        run: |
          if [ -d frontend/ZoneGoApp ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No frontend/ZoneGoApp directory yet, skipping."
          fi

      - uses: actions/setup-node@v4
        if: steps.look.outputs.found == 'true'
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/ZoneGoApp/package-lock.json

      - name: Install dependencies
        if: steps.look.outputs.found == 'true'
        working-directory: frontend/ZoneGoApp
        run: npm ci

      - name: Lint
        if: steps.look.outputs.found == 'true'
        working-directory: frontend/ZoneGoApp
        run: npm run lint

      - name: Build
        if: steps.look.outputs.found == 'true'
        working-directory: frontend/ZoneGoApp
        env:
          VITE_PRIVY_APP_ID: placeholder-for-ci-build-only
          VITE_API_BASE_URL: https://zonego-api.onrender.com
          VITE_WORLD_APP_ID: app_21d59893ffc06ad498e97bf77cb59698
        run: npm run build