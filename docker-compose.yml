# One command to get the API up, for anyone on the team and for a judge
# cloning the repo:
#
#   docker compose up
#
# Then http://localhost:8000/docs

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Mock mode by default, so this works before the contracts are deployed.
      MOCK_MODE: "${MOCK_MODE:-true}"
      RPC_URL: "${RPC_URL:-}"
      SUBGRAPH_URL: "${SUBGRAPH_URL:-}"
      VISIT_REGISTRY_ADDRESS: "${VISIT_REGISTRY_ADDRESS:-0x0000000000000000000000000000000000000000}"
      CAMPAIGN_VAULT_ADDRESS: "${CAMPAIGN_VAULT_ADDRESS:-0x0000000000000000000000000000000000000000}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000}"
      # Empty by default and never committed. Without them the API still reads,
      # searches and ranks — it just cannot send a transaction or attest.
      RELAY_PRIVATE_KEY: "${RELAY_PRIVATE_KEY:-}"
      ATTESTER_PRIVATE_KEY: "${ATTESTER_PRIVATE_KEY:-}"
      WORLD_APP_ID: "${WORLD_APP_ID:-}"
      WORLD_RP_ID: "${WORLD_RP_ID:-}"
      WORLD_RP_SIGNING_KEY: "${WORLD_RP_SIGNING_KEY:-}"
      WORLD_ACTION: "${WORLD_ACTION:-verify-visitor}"
    volumes:
      # Live reload while developing. Production builds the image without this.
      - ./api:/app/api:ro
    command: >
      uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
