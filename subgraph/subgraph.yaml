specVersion: 1.0.0
description: Verified physical store visits, rewards and fraud epochs for ZoneGo.
repository: https://github.com/ZoneGo-App/ZoneGo
schema:
  file: ./schema.graphql

dataSources:
  # Base Sepolia, deployed 7 September in blocks 46522139 and 46522140. The
  # start block is the earlier of the two for all three: indexing from before a
  # contract exists costs nothing, and one number is easier to keep true than
  # three.
  - kind: ethereum
    name: CampaignVault
    network: base-sepolia
    source:
      abi: CampaignVault
      address: "0xf4ADec71da03c6595CF4624f7d4573C9EDb753B0"
      startBlock: 46522139
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/campaign-vault.ts
      entities:
        - Campaign
        - Merchant
      abis:
        - name: CampaignVault
          file: ./abis/CampaignVault.json
      eventHandlers:
        - event: CampaignCreated(indexed uint256,indexed address,uint256,uint256,bytes32,uint256)
          handler: handleCampaignCreated
        - event: CampaignFunded(indexed uint256,indexed address,uint256)
          handler: handleCampaignFunded

  - kind: ethereum
    name: VisitRegistry
    network: base-sepolia
    source:
      abi: VisitRegistry
      address: "0xD33f2e26f11Fe011835D791EbA1BFE123479998A"
      startBlock: 46522139
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/visit-registry.ts
      entities:
        - Visit
        - Reward
        - Visitor
        - Merchant
        - Campaign
        - CampaignHour
      abis:
        - name: VisitRegistry
          file: ./abis/VisitRegistry.json
      eventHandlers:
        - event: VisitRecorded(indexed uint256,indexed address,bytes32,uint64,bytes32)
          handler: handleVisitRecorded
        - event: RewardPaid(indexed uint256,indexed address,uint256)
          handler: handleRewardPaid

  - kind: ethereum
    name: FraudOracle
    network: base-sepolia
    source:
      # Skeleton: commitEpoch still reverts, so nothing is emitted here yet.
      # Indexed from the start anyway, so the first committed epoch appears
      # without a redeploy.
      abi: FraudOracle
      address: "0x5157504d3a9683Ca953EF5db1255dE619E110A9B"
      startBlock: 46522139
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/fraud-oracle.ts
      entities:
        - Epoch
      abis:
        - name: FraudOracle
          file: ./abis/FraudOracle.json
      eventHandlers:
        - event: EpochCommitted(indexed uint64,bytes32)
          handler: handleEpochCommitted
