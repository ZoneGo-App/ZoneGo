specVersion: 1.0.0
description: Verified physical store visits, rewards and fraud epochs for ZoneGo.
repository: https://github.com/ZoneGo-App/ZoneGo
schema:
  file: ./schema.graphql

dataSources:
  # Base Sepolia, deployed 7 September in blocks 46522139 and 46522140. The
  # start block is the earlier of the two for all three: indexing from before a
  # contract exists costs nothing, and one number is easier to keep true than
  # three.
  - kind: ethereum
    name: CampaignVault
    network: base-sepolia
    source:
      abi: CampaignVault
      address: "0x7b4aaDDe248818bAD121431eAd1a3A865914c419"
      startBlock: 46725201
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/campaign-vault.ts
      entities:
        - Campaign
        - Merchant
      abis:
        - name: CampaignVault
          file: ./abis/CampaignVault.json
      eventHandlers:
        - event: CampaignCreated(indexed uint256,indexed address,uint256,uint256,bytes32,uint256)
          handler: handleCampaignCreated
        - event: CampaignFunded(indexed uint256,indexed address,uint256)
          handler: handleCampaignFunded
        # The three ways a campaign stops being worth walking to. Indexing the
        # money in and not the money out left `balance` reading high forever
        # after a merchant withdrew, and `active` reading true forever after
        # they paused — and search sends people to whatever reads active.
        - event: CampaignWithdrawn(indexed uint256,indexed address,uint256)
          handler: handleCampaignWithdrawn
        - event: CampaignPaused(indexed uint256)
          handler: handleCampaignPaused
        - event: CampaignUnpaused(indexed uint256)
          handler: handleCampaignUnpaused

  - kind: ethereum
    name: VisitRegistry
    network: base-sepolia
    source:
      abi: VisitRegistry
      address: "0xed168b6B9c96f59Be1AD3866F24e8851D3Afca4e"
      startBlock: 46725201
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/visit-registry.ts
      entities:
        - Visit
        - Reward
        - Visitor
        - Merchant
        - Campaign
        - CampaignHour
      abis:
        - name: VisitRegistry
          file: ./abis/VisitRegistry.json
      eventHandlers:
        - event: VisitRecorded(indexed uint256,indexed address,bytes32,uint64,bytes32)
          handler: handleVisitRecorded
        - event: RewardPaid(indexed uint256,indexed address,uint256)
          handler: handleRewardPaid

  - kind: ethereum
    name: FraudOracle
    network: base-sepolia
    source:
      # Skeleton: commitEpoch still reverts, so nothing is emitted here yet.
      # Indexed from the start anyway, so the first committed epoch appears
      # without a redeploy.
      abi: FraudOracle
      address: "0xfD18B748C0868C64d0bC5a68896CF3aF1d776243"
      startBlock: 46725201
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/fraud-oracle.ts
      entities:
        - Epoch
      abis:
        - name: FraudOracle
          file: ./abis/FraudOracle.json
      eventHandlers:
        - event: EpochCommitted(indexed uint64,bytes32)
          handler: handleEpochCommitted
